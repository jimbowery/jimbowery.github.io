<html>

{% include head.html %}

<style>
	.photo-frame {
		display: inline-block;
		padding: 20px;
		background-color: white;
		box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
	}
	
	.photo-frame img {
		display: block;
		max-width: 100%;
		height: auto;
	}
</style>

<body>

    {% include head.html %} 
    
<!-- Main -->
<div id="main" class="alt">

<!-- One -->
<section id="one">
	<div class="inner">
		{% if page.image %}<span class="image main photo-frame"><img src="{{ site.baseurl }}/{{ page.image }}" alt="{{ page.title }}" /></span>{% endif %}
		<header class="major">
			<h1>{{ page.title }}</h1>
		</header>
	</div>
</section>

</div>

    {% include footer.html %}

</body>

</html>
