// Shuffle-bag: every idea appears once before any repeats.
let bag = [];
function next() {
  if (bag.length === 0) {
    bag = IDEAS.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  return IDEAS[bag.pop()];
}

document.getElementById('go').addEventListener('click', () => {
  const [n, html] = next();
  document.getElementById('num').textContent = `#${n} of ${IDEAS.length}`;
  document.getElementById('idea').innerHTML = html;
});
