name: Auto-create Photo Post on Image Upload

on:
  push:
    paths:
      - 'assets/images/**'
    branches:
      - main

jobs:
  create-photo-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed image files
        id: changed-files
        run: |
          # Get the list of added files in assets/images/
          FILES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD | grep '^assets/images/' || true)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Create post for new image
        if: steps.changed-files.outputs.files != ''
        run: |
          # Process each new image file
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            
            # Extract filename without extension
            filename=$(basename "$file")
            filename_no_ext="${filename%.*}"
            
            # Create post filename with date
            post_date=$(date +%Y-%m-%d)
            post_filename="_posts/${post_date}-${filename_no_ext}.md"
            
            # Skip if post already exists
            if [ -f "$post_filename" ]; then
              echo "Post already exists: $post_filename"
              continue
            fi
            
            # Create the post with title from filename (convert hyphens/underscores to spaces)
            title=$(echo "$filename_no_ext" | sed 's/[-_]/ /g' | sed 's/\b\(.\)/\U\1/g')
            
            cat > "$post_filename" << EOF
---
layout: photo-post
title: ${title}
description: 
image: ${file}
---
EOF
            
            echo "Created post: $post_filename"
          done <<< "${{ steps.changed-files.outputs.files }}"

      - name: Commit and push post
        run: |
          if git diff --quiet --exit-code; then
            echo "No changes to commit"
            exit 0
          fi
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _posts/
          git commit -m "chore: auto-create photo post from image upload

- Generated automatically when image added to assets/images/

📸 - Generated by Copilot"
          git push
